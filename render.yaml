services:
  - type: web
    name: arpit-screen-access
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: DB_PATH
        value: /tmp/arpit.db
      - key: APK_DIR
        value: /tmp/apks
      - key: KS_PASS
        value: Arpit@2026
      - key: KS_ALIAS
        value: arpit
      - key: KEYSTORE
        value: /app/keys/arpit.jks
      - key: BUILD_TOOLS
        value: /opt/android/build-tools/34.0.0
      - key: ANDROID_JAR
        value: /opt/android/platforms/android-34/android.jar
